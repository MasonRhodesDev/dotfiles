font_family      Lilex
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

shell /usr/bin/bash --login

background_opacity            0.95
dynamic_background_opacity    yes
linux_display_server          wayland
update_check_interval         0
remember_window_size          no

filter_notification all

tab_bar_edge      top
tab_bar_style     custom
tab_bar_min_tabs  9999
tab_bar_align     left

allow_remote_control yes
listen_on            unix:@kitty-{kitty_pid}

watcher watcher.py

include lmtt-colors.conf

map shift+enter send_text all \x1b\r

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

map ctrl+v kitten paste_image.py

symbol_map U+E1A0-U+E1BA Herdr Agent Icons Max
symbol_map U+E1C0-U+E1C5 Herdr Agent Icons Max
