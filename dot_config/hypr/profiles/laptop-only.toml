description = "Framework 16 internal panel only (no externals connected)."
match = ["desc:BOE 0x0BC9"]

# Also serves as the lowest-priority fallback when no other profile matches:
# the single match makes it prio=1, so any multi-monitor profile outranks it.
# Keep the serial (0x0BC9) on the match -- a bare `desc:BOE` prefix would make
# this collide with every profile that includes the built-in panel.

[[monitor]]
output = "eDP-2"
mode = "2560x1600@165"
scale = 1.25

[[workspace]]
workspace = "1"
monitor = "eDP-2"
default = true
