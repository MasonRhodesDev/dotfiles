description = "Dual Dell S2725QC 4K @ 120Hz + built-in, side-by-side, target 150%."
match = ["desc:Dell Inc. DELL S2725QC 5DGMS84", "desc:Dell Inc. DELL S2725QC FFJMS84"]

# No explicit positions: monitors lay out as a row in declaration order, with
# x offsets derived from logical widths (2560 + 2560 -> eDP at 5120). Each
# target scale snaps to the nearest valid fractional scale, so the eDP's 1.5
# below lands on 1.6 -- exact 1.5 is invalid for 2560x1600 (non-integer
# logical size). Check `hyprctl monitors` for the snapped value, not this file.
#
# DP-1 (FFJMS84) is dGPU-direct; DP-4 (5DGMS84) and the eDP run through the
# card2->card1 copy path. That hybrid is what sustains 2x4K@120 here -- see
# `hyprstate gpu status` for the live per-output copy-path readout.

[[monitor]]
output = "desc:Dell Inc. DELL S2725QC 5DGMS84"
mode = "3840x2160@120"
scale = 1.5

[[monitor]]
output = "desc:Dell Inc. DELL S2725QC FFJMS84"
mode = "3840x2160@120"
scale = 1.5

[[monitor]]
output = "eDP-2"
mode = "2560x1600@165"
scale = 1.5

[[workspace]]
workspace = "1"
monitor = "desc:Dell Inc. DELL S2725QC 5DGMS84"
default = true
