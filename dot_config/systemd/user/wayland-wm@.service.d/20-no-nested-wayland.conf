[Service]
# Hyprland must never see a foreign Wayland socket at launch: the tty2
# recovery cage owns wayland-0 and never exits, and if the user-manager env
# still points at it, aquamarine adds a nested WAYLAND-1 output inside the
# real session (waybar's real-monitor bar then never configures). uwsm
# finalize re-exports the session's own socket after startup, so nothing
# downstream loses it.
UnsetEnvironment=WAYLAND_DISPLAY
