name: Test Dotfiles

on:
  pull_request:
    branches:
      - main

jobs:
  test-fedora:
    name: Test on Fedora 41
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build Fedora test container
        run: |
          docker build -f tests/Dockerfile.fedora -t chezmoi-test-fedora .

      - name: Run basic installation test
        run: |
          docker run --rm \
            -v $(pwd)/tests/scenarios:/tests:ro,Z \
            chezmoi-test-fedora \
            bash /tests/basic-install.sh

      - name: Run state tracking test
        run: |
          docker run --rm \
            -v $(pwd)/tests/scenarios:/tests:ro,Z \
            chezmoi-test-fedora \
            bash /tests/state-tracking.sh

      - name: Run profile detection test
        run: |
          docker run --rm \
            -v $(pwd)/tests/scenarios:/tests:ro,Z \
            chezmoi-test-fedora \
            bash /tests/profile-detection.sh

      - name: Run service validation test
        run: |
          docker run --rm \
            -v $(pwd)/tests/scenarios:/tests:ro,Z \
            chezmoi-test-fedora \
            bash /tests/service-validation.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: fedora-test-results
          path: tests/results/

  test-arch:
    name: Test on Arch Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build Arch test container
        run: |
          docker build -f tests/Dockerfile.arch -t chezmoi-test-arch .

      - name: Run basic installation test
        run: |
          docker run --rm \
            -v $(pwd)/tests/scenarios:/tests:ro,Z \
            chezmoi-test-arch \
            bash /tests/basic-install.sh

      - name: Run state tracking test
        run: |
          docker run --rm \
            -v $(pwd)/tests/scenarios:/tests:ro,Z \
            chezmoi-test-arch \
            bash /tests/state-tracking.sh

      - name: Run profile detection test
        run: |
          docker run --rm \
            -v $(pwd)/tests/scenarios:/tests:ro,Z \
            chezmoi-test-arch \
            bash /tests/profile-detection.sh

      - name: Run service validation test
        run: |
          docker run --rm \
            -v $(pwd)/tests/scenarios:/tests:ro,Z \
            chezmoi-test-arch \
            bash /tests/service-validation.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: arch-test-results
          path: tests/results/

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-fedora, test-arch]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          path: test-results

      - name: Display summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Fedora 41" >> $GITHUB_STEP_SUMMARY
          if [ -d "test-results/fedora-test-results" ]; then
            echo "✅ Tests completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Tests failed or incomplete" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Arch Linux" >> $GITHUB_STEP_SUMMARY
          if [ -d "test-results/arch-test-results" ]; then
            echo "✅ Tests completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Tests failed or incomplete" >> $GITHUB_STEP_SUMMARY
          fi
