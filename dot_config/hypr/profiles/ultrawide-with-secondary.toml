description = "Dell S3422DWG ultrawide (primary) + S2721QS rotated portrait (secondary)."
match = ["desc:Dell Inc. DELL S3422DWG HSRTS63", "desc:Dell Inc. DELL S2721QS 6VSGM43"]

[[monitor]]
output = "desc:Dell Inc. DELL S3422DWG HSRTS63"
mode = "3440x1440@144"

[[monitor]]
output = "desc:Dell Inc. DELL S2721QS 6VSGM43"
mode = "3840x2160@60"
scale = 1.5
transform = 3

[[workspace]]
workspace = "1"
monitor = "desc:Dell Inc. DELL S3422DWG HSRTS63"
default = true

# Gaming workspace (Big Picture lands here fullscreen) belongs on the ultrawide,
# not the portrait secondary -- this profile is the only multi-monitor one where
# ws7 could stray.
[[workspace]]
workspace = "7"
monitor = "desc:Dell Inc. DELL S3422DWG HSRTS63"
