# Profile: HP E243 rotated portrait (left) + Dell S2721HGF 1080p144 (middle)
# + built-in panel (right).
#
#@ match = desc:HP Inc. HP E243 CNK7510Y4B
#@ match = desc:Dell Inc. DELL S2721HGF 85YFP83
#@ edp = auto

# transform 1 = 90deg; portrait footprint is 1080x1920. The HP is physically
# centered against the Dell, so the Dell and eDP sit (1920 - 1080) / 2 = 420
# down rather than sharing the HP's top edge.
monitor = desc:HP Inc. HP E243 CNK7510Y4B,1920x1080@60,0x0,1,transform,1
monitor = desc:Dell Inc. DELL S2721HGF 85YFP83,1920x1080@144,1080x420,1
monitor = eDP-2,2560x1600@165,3000x420,1.25

workspace = 1, monitor:desc:Dell Inc. DELL S2721HGF 85YFP83, default:true
