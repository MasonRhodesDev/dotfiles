# AppImages prepend their bundled libraries to LD_LIBRARY_PATH and every child
# process inherits them, so a browser spawned from inside one loads foreign libs
# against Fedora binaries and dies (chromium: libtiff.so.6 "version
# LIBTIFF_4.6.1 not found") — links silently never open. xdg-open and Rust's
# `open` crate both honor $BROWSER, so pointing it at the cleaning shim fixes
# link-opening for every AppImage, independent of any repack. The shim unsets
# BROWSER before handing off, so there is no loop; outside an AppImage it is a
# pass-through to /usr/bin/xdg-open.
# Managed by ~/.local/bin/buzz-appimage-patch (writes the shim).
BROWSER=/home/mason/.local/bin/appimage-safe-open
