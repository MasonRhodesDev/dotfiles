# A herdr server relaunched out-of-band (systemd-run, per the update playbook)
# leaves this unit racing a live server: "already running", exit 1, restart
# churn at every login until StartLimitBurst trips. Skip cleanly when a live
# server already listens; after a reboot the socket is gone and the unit owns
# herdr again.
[Service]
ExecCondition=/bin/sh -c '! ss -xl | grep -qF "%h/.config/herdr/herdr.sock"'
