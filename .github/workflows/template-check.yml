name: Template render check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  render:
    name: Render (${{ matrix.profile == 'true' && 'work' || 'personal' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ["true", "false"]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Render config template
        env:
          CHEZMOI_GIT_OVERRIDES: '[]'
          CHEZMOI_IDENTITY_EMAIL_PERSONAL: ci-personal@example.invalid
          CHEZMOI_IDENTITY_EMAIL_WORK: ci-work@example.invalid
          CHEZMOI_IDENTITY_NAME: CI Template Check
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi init --source "$PWD" \
            --promptBool "Is this a work machine"=${{ matrix.profile }} \
            --promptBool "Is this a headless machine (SSH only, no desktop)"=false
          echo "### Config rendered (is_work=${{ matrix.profile }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Render all source templates
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi status --source "$PWD" > /dev/null
          count=$(find . -name '*.tmpl' -not -path './.git/*' | wc -l)
          echo "✅ All templates rendered cleanly ($count .tmpl files, is_work=${{ matrix.profile }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify profile gating
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          is_work=$(chezmoi data --source "$PWD" | jq -r .is_work)
          [ "$is_work" = "${{ matrix.profile }}" ] || { echo "::error::is_work rendered '$is_work', expected '${{ matrix.profile }}'"; exit 1; }
          echo "✅ is_work=$is_work, profile=$(chezmoi data --source "$PWD" | jq -r .profile.type)" >> "$GITHUB_STEP_SUMMARY"

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          # Scan what HEAD reaches: on a pull request that is the PR merged into its
          # base branch (the PR's commits plus all of the base), on a push to main it
          # is main. Other branches and tags are not scanned, so their findings can't
          # fail an unrelated PR. Without --log-opts gitleaks scans every ref (--all).
          # --diff-merges=first-parent also scans what a merge commit itself adds
          # (a conflict resolution), which plain git log -p skips.
          rc=0
          out=$(./gitleaks git . --no-banner --no-color --redact --config .gitleaks.toml \
            --log-opts="HEAD --diff-merges=first-parent" 2>&1) || rc=$?
          echo "$out"
          [ "$rc" -eq 0 ] || exit "$rc"
          # gitleaks exits 0 when git log itself fails, having scanned nothing
          echo "$out" | grep -Eq '\b[1-9][0-9]* commits scanned' || { echo "::error::gitleaks scanned no commits"; exit 1; }
          echo "✅ No secrets found in HEAD's history (gitleaks ${GITLEAKS_VERSION})" >> "$GITHUB_STEP_SUMMARY"
