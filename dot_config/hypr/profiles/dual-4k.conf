# Profile: Dual Dell S2725QC 4K @ 120Hz, scale 1.5, side-by-side.
#
#@ match = desc:Dell Inc. DELL S2725QC 5DGMS84
#@ match = desc:Dell Inc. DELL S2725QC FFJMS84
#@ edp = auto

monitor = desc:Dell Inc. DELL S2725QC 5DGMS84,3840x2160@120,0x0,1.5
monitor = desc:Dell Inc. DELL S2725QC FFJMS84,3840x2160@120,2560x0,1.5
# eDP-2 sits to the right of both 4Ks (5120 = 2560 + 2560). Exact 1.5 is not a
# valid scale for 2560x1600 (non-integer logical size); 1.6 is the closest valid.
monitor = eDP-2,2560x1600@165,5120x0,1.6

workspace = 1, monitor:desc:Dell Inc. DELL S2725QC 5DGMS84, default:true
